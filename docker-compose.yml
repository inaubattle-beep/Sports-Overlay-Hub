version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sportsoverlayhub-app
    container_name: sportsoverlay_app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'

  web:
    image: nginx:alpine
    container_name: sportsoverlay_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sportsoverlay_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sportsoverlay
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
